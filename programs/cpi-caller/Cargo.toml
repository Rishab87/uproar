[package]
name = "cpi-caller"
version = "0.0.0"
description = "Test-only program: forwards an instruction to another program by CPI. Never deployed."
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
